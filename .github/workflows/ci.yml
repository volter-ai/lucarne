name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  acceptance:
    # The crown jewel: run the real acceptance proofs against real Chrome.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Chrome, ffmpeg, xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xvfb ffmpeg
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version
      - run: npm ci
      - run: npm run build
      # headful Chrome (real fingerprint) needs a display → xvfb
      - run: xvfb-run -a npm run test:acceptance
