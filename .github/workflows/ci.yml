name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # No-Chrome-needed unit tests (store/policy/registry-round-trip logic) —
      # cheap enough to run on every push, unlike the Chrome-gated acceptance job.
      - run: npm run test:unit

  acceptance:
    # The crown jewel: run the real acceptance proofs against real Chrome.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Chrome, ffmpeg, xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xvfb ffmpeg
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version
      - run: npm ci
      - run: npm run build
      # The suite runs headless by default (fast, no display needed); xvfb +
      # LUCARNE_TEST_HEADED=1 additionally exercise the real headful path.
      - run: xvfb-run -a npm run test:acceptance
        env:
          LUCARNE_TEST_HEADED: "1"
