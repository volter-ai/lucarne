name: release
# Publishes the 2 npm packages (packages/*) to the npm registry: `lucarne` (the engine, widget
# included) and `lucarne-interact` (the verbs, recall, the records store, and the one lucarne-mcp).
# `lucarne-interact` is not yet published, and npm only allows a Trusted Publisher (OIDC) to be
# configured on an ALREADY-EXISTING package — so its first publish cannot use OIDC and instead
# authenticates with an npm token.
#
# ONE-TIME setup: the owner creates an npm Granular Access Token (or automation token) with
# publish rights to both packages (lucarne, lucarne-interact) and adds it as the repo secret
# `NPM_TOKEN`. After that, dispatch this workflow with dry_run=false, or push a `v*` tag, to do a
# real publish (with provenance). Once both packages exist on npm, they MAY later migrate to OIDC
# Trusted Publishing (configure a trusted publisher per package on npmjs.com) and drop the token —
# optional hardening, not required for the first publish.
#
# Trigger this manually with dry_run=true (default) to prove the publish plan/tarballs with no
# registry credentials. `pull_request` runs (scoped to this file) are always a dry run too, so the
# workflow is provable in CI before it's ever eligible to be dispatched (GitHub only allows
# workflow_dispatch once the workflow file is on the default branch) — and it's fail-safe: no
# event other than a `v*` tag push or an explicit workflow_dispatch dry_run=false can ever
# real-publish.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no packages are actually published)"
        type: boolean
        default: true
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  id-token: write   # OIDC for provenance attestation (auth for the first publish is via NPM_TOKEN)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm install -g npm@latest

      # The two packages are independent: lucarne-interact depends on no lucarne package (it
      # reaches a session over its cdpUrl, and a daemon over HTTP), so publish order is free.
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e

          # Fail-safe DRY definition: real publish ONLY on a tag push OR an explicit dispatch
          # with dry_run=false. Everything else (pull_request, dispatch-default) is a dry run —
          # a pull_request run can NEVER real-publish, and needs no secret.
          DRY=true
          if [ "${{ github.event_name }}" = "push" ]; then DRY=false; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "false" ]; then DRY=false; fi
          echo "dry_run=$DRY (event=${{ github.event_name }})"

          for p in lucarne lucarne-interact; do
            ver="$(node -p "require('./packages/$p/package.json').version")"
            echo "== $p@$ver =="

            # Idempotency guard: skip packages whose exact version is already on npm, so
            # re-running this workflow (e.g. after a partial failure) doesn't error out.
            # Dry-run still packs regardless — it publishes nothing, so it's harmless to repeat.
            published="$(npm view "$p@$ver" version 2>/dev/null || true)"
            if [ "$DRY" = "false" ] && [ "$published" = "$ver" ]; then
              echo "skip: $p@$ver is already published"
              continue
            fi

            if [ "$DRY" = "true" ]; then
              npm publish --dry-run --workspace="packages/$p" --access public
            else
              npm publish --provenance --access public --workspace="packages/$p"
            fi
          done

      - name: Verify published versions
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: |
          for p in lucarne lucarne-interact; do
            ver="$(node -p "require('./packages/$p/package.json').version")"
            live="$(npm view "$p" version)"
            echo "$p: local=$ver published=$live"
          done
